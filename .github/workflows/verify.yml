name: Verify

# Publishing is handled by GitHub's own pages-build-deployment workflow, which
# runs automatically because Pages is configured to serve main /docs.
#
# This workflow therefore only VERIFIES. It must not deploy: two workflows
# targeting the github-pages environment contend for the same concurrency
# group, and the loser is cancelled — which is exactly what happened when this
# file also carried a deploy job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-ref, and deliberately NOT the Pages group.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Data, tests, and build drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: pip install --quiet pytest

      - name: Check the shipped data
        # The manuscript is not distributed, so extraction cannot run here.
        # This validates the committed data — the artifact that actually ships.
        run: python scripts/validate.py data

      - name: Python tests
        run: python -m pytest -q

      - name: Browser-module tests
        # Unquoted so the shell expands the glob: node --test only learned to
        # expand globs itself in Node 22, and this must not depend on that.
        run: node --test tests/*.test.js

      - name: Rebuild the site and check it matches what is committed
        # A drifted docs/ means someone edited a page by hand instead of the
        # renderer, or forgot to rebuild after changing the data.
        run: |
          python scripts/build.py --strict
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "::error::docs/ is out of date — run scripts/build.py and commit"
            git --no-pager diff --stat docs/
            exit 1
          fi
