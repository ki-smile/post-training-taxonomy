name: Test and deploy

# Pages is configured to deploy from a workflow, so nothing publishes without
# this file. Tests gate the deploy: the site is a reference for a taxonomy
# people cite, and shipping a broken build is worse than shipping late.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: pip install --quiet pytest

      - name: Check the shipped data
        # The manuscript is not distributed, so extraction cannot run here.
        # This validates the committed data — the artifact that actually ships.
        run: python scripts/validate.py data

      - name: Python tests
        run: python -m pytest -q

      - name: Browser-module tests
        run: node --test "tests/*.test.js"

      - name: Rebuild the site and check it matches what is committed
        # A drifted docs/ means someone edited a page by hand instead of the
        # renderer, or forgot to rebuild after changing the data.
        run: |
          python scripts/build.py --strict
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "::error::docs/ is out of date — run scripts/build.py and commit"
            git --no-pager diff --stat docs/
            exit 1
          fi

  deploy:
    name: Deploy to Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
